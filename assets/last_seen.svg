<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" fill="none" stroke="currentColor"
	stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">

	<!-- Slightly enlarge the complete icon -->
	<g transform="translate(50 50) scale(1.08) translate(-50 -50)">

		<!-- Location pin -->
		<path d="
      M50 10
      C36.8 10 26 20.8 26 34
      C26 51.5 39.5 68.5 50 78
      C60.5 68.5 74 51.5 74 34
      C74 20.8 63.2 10 50 10
      Z
    " />

		<!-- Centre of location pin -->
		<circle cx="50" cy="33" r="9" />

		<!-- Ground / position ellipse -->
		<path d="
      M29 64
      C17 66.5 10 70.5 10 76
      C10 84 28 90 50 90
      C55 90 59.5 89.6 63 88.8
    " />

		<!-- Last-seen clock moved up and left -->
		<g id="lastReportedClock" stroke-width="4">

			<circle cx="77.5" cy="77.5" r="17" />

			<!-- Hour hand -->
			<path d="M77.5 77.5 L77.5 67.5" />

			<!-- Minute hand -->
			<path d="M77.5 77.5 L85.5 82.3" />

		</g>

	</g>
</svg>