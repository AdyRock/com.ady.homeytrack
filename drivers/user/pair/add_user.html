<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Add a user</title>
</head>

<body>

	<header class="homey-header">
		<h1 class="homey-title" data-i18n="pair.addUser.title">Add a user</h1>
		<p class="homey-subtitle" data-i18n="pair.addUser.subtitle">Create a device to track a family member's location</p>
	</header>

	<form class="homey-form">
		<div class="homey-form-group" id="importedUserGroup" hidden>
			<label class="homey-form-label" for="importedUser" data-i18n="pair.addUser.importedUser">Restored user</label>
			<select class="homey-form-select" id="importedUser"></select>
		</div>

		<div class="homey-form-group">
			<label class="homey-form-label" for="name" data-i18n="pair.addUser.name">Name</label>
			<input class="homey-form-input" type="text" id="name">
		</div>

		<div class="homey-form-group">
			<label class="homey-form-label" for="userId" data-i18n="pair.addUser.userId">User ID</label>
			<input class="homey-form-input" type="text" id="userId">
		</div>
		<p data-i18n="pair.addUser.note">Use this User ID as the OwnTracks username (MQTT), or in the HTTP endpoint URL configured in the app settings.</p>
	</form>

	<script type="text/javascript">
		// Homey is available as a global directly here (no onHomeyReady wrapper needed for pair views)
		Homey.ready();

		const nameInput = document.getElementById('name');
		const userIdInput = document.getElementById('userId');
		const importedUserGroup = document.getElementById('importedUserGroup');
		const importedUserInput = document.getElementById('importedUser');
		let userIdEdited = false;

		nameInput.placeholder = Homey.__('pair.addUser.namePlaceholder');
		userIdInput.placeholder = Homey.__('pair.addUser.userIdPlaceholder');

		Promise.all([
			Homey.getViewStoreValue('done', 'name'),
			Homey.getViewStoreValue('done', 'userId'),
		]).then(([storedName, storedUserId]) =>
		{
			if (storedName) nameInput.value = storedName;
			if (storedUserId)
			{
				userIdInput.value = storedUserId;
				userIdEdited = true;
			}
		});

		function slugify(value)
		{
			return value
				.toLowerCase()
				.trim()
				.replace(/[^a-z0-9]+/g, '-')
				.replace(/(^-|-$)/g, '');
		}

		function syncPairDetails()
		{
			Homey.emit('setPairDetails', {
				name: nameInput.value.trim(),
				userId: userIdInput.value.trim(),
			}, (err) =>
			{
				if (err) Homey.alert(err);
			});
		}

		Homey.emit('getImportedUsers', null, (err, users) =>
		{
			if (err || !Array.isArray(users) || !users.length) return;
			const promptOption = document.createElement('option');
			promptOption.value = '';
			promptOption.textContent = Homey.__('pair.addUser.chooseImportedUser');
			importedUserInput.appendChild(promptOption);
			users.forEach((user) =>
			{
				const option = document.createElement('option');
				option.value = user.userId;
				option.textContent = `${user.name} (${user.userId})`;
				option.dataset.name = user.name;
				importedUserInput.appendChild(option);
			});
			importedUserGroup.hidden = false;
		});

		importedUserInput.addEventListener('change', () =>
		{
			const option = importedUserInput.selectedOptions[0];
			if (!option || !option.value) return;
			nameInput.value = option.dataset.name;
			userIdInput.value = option.value;
			userIdEdited = true;
			syncPairDetails();
		});

		userIdInput.addEventListener('input', () =>
		{
			userIdEdited = true;
			syncPairDetails();
		});
		nameInput.addEventListener('input', () =>
		{
			if (!userIdEdited) userIdInput.value = slugify(nameInput.value);
			syncPairDetails();
		});
	</script>
</body>

</html>
