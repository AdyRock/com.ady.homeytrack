<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Add a user</title>
</head>

<body>

	<header class="homey-header">
		<h1 class="homey-title" data-i18n="pair.addUser.title">Add a user</h1>
		<p class="homey-subtitle" data-i18n="pair.addUser.subtitle">Create a device to track a family member's location</p>
	</header>

	<form class="homey-form">
		<div class="homey-form-group">
			<label class="homey-form-label" for="name" data-i18n="pair.addUser.name">Name</label>
			<input class="homey-form-input" type="text" id="name">
		</div>

		<div class="homey-form-group">
			<label class="homey-form-label" for="userId" data-i18n="pair.addUser.userId">User ID</label>
			<input class="homey-form-input" type="text" id="userId">
		</div>
		<p data-i18n="pair.addUser.note">Use this User ID as the OwnTracks username (MQTT), or in the HTTP endpoint URL configured in the app settings.</p>

		<button type="button" id="addUser" class="homey-button-primary-full" data-i18n="pair.addUser.submit">Add user</button>
	</form>

	<script type="text/javascript">
		// Homey is available as a global directly here (no onHomeyReady wrapper needed for pair views)
		Homey.ready();

		const nameInput = document.getElementById('name');
		const userIdInput = document.getElementById('userId');
		const addButton = document.getElementById('addUser');
		let userIdEdited = false;

		nameInput.placeholder = Homey.__('pair.addUser.namePlaceholder');
		userIdInput.placeholder = Homey.__('pair.addUser.userIdPlaceholder');

		function slugify(value)
		{
			return value
				.toLowerCase()
				.trim()
				.replace(/[^a-z0-9]+/g, '-')
				.replace(/(^-|-$)/g, '');
		}

		userIdInput.addEventListener('input', () => { userIdEdited = true; });
		nameInput.addEventListener('input', () =>
		{
			if (!userIdEdited) userIdInput.value = slugify(nameInput.value);
		});

		addButton.addEventListener('click', () =>
		{
			const name = nameInput.value.trim();
			const userId = slugify(userIdInput.value);

			if (!name || !userId)
			{
				Homey.alert(Homey.__('pair.addUser.fillInRequired'));
				return;
			}

			Homey.createDevice({
				name,
				data: { id: userId },
			}).then(() =>
			{
				Homey.setViewStoreValue('done', 'userId', userId).then(() =>
				{
					Homey.showView('done');
				});
			}).catch((err) =>
			{
				// err can be an Error/object, which some Homey.alert implementations fail to render
				Homey.alert(err && err.message ? err.message : String(err));
			});
		});
	</script>
</body>

</html>
